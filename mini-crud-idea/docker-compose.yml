services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: team-hub-backend
    ports:
      - "8000:8000"
    env_file:
      - .env

  frontend:
    build:
      context: ../front-mini-app
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: team-hub-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
